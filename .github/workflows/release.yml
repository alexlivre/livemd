name: Release

# Builds the Windows installer on GitHub-hosted runners (required by SignPath
# for OSS origin verification), submits it to SignPath for code signing and
# publishes the signed installer to the GitHub Release of the pushed tag.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read

jobs:
  build-and-sign:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Generate icons and installer header
        run: npm run build:icon

      # Unsigned build on purpose — SignPath signs the installer afterwards.
      # CSC_IDENTITY_AUTO_DISCOVERY=false keeps electron-builder from picking
      # up any certificate found in the runner's store.
      - name: Build unsigned installer
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload unsigned installer
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: livemd-unsigned-${{ github.ref_name }}
          path: release/LiveMD-Setup-*.exe

      - name: Submit signing request to SignPath
        id: signpath
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORG_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 900
          output-artifact-directory: release-signed

      - name: Publish signed installer to GitHub Release
        run: |
          gh release upload "${{ github.ref_name }}" release-signed/LiveMD-Setup-*.exe --clobber
        env:
          GH_TOKEN: ${{ github.token }}
