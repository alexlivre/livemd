name: Release

# Builds the Windows installer on GitHub-hosted runners and publishes the
# unsigned installer to the GitHub Release of the pushed tag.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Generate icons and installer header
        run: npm run build:icon

      # Unsigned build — CSC_IDENTITY_AUTO_DISCOVERY=false keeps electron-builder
      # from picking up any certificate found in the runner's store.
      - name: Build installer
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Publish installer to GitHub Release
        run: |
          gh release upload "${{ github.ref_name }}" release/LiveMD-Setup-*.exe --clobber
        env:
          GH_TOKEN: ${{ github.token }}
